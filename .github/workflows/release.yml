name: release

# T-067：多平台原生件矩阵 + dxc 产物 + vsix 打包与体积口径。
# 平台面沿用 ADR 0005 的 6 档（与上游 tree-sitter / tree-sitter-hlsl 的 prebuilds 同构）：
# win32-x64 / win32-arm64 / linux-x64 / linux-arm64 / darwin-x64 / darwin-arm64。
# 注意：`prebuildify` 不做交叉编译，每档都要在对应 runner 上编；win32-arm64 用 node-gyp 的
# `--arch=arm64`（Windows runner 自带 ARM64 工具集）。darwin-x64 例外：GitHub 已退役 Intel mac
# runner（macos-13 无 runner 可调度，实测排队至超时），改在 arm64 runner 上 `--arch=x64`
# 交叉编译（纯 C 绑定，clang 交叉可靠；prebuildify 按 --arch 命名产物目录），并用 `file`
# 校验产物架构，防「假 x64」混进 ADR 0005 的档位目录。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
            archFlag: ''
          - target: win32-arm64
            os: windows-latest
            archFlag: '--arch=arm64'
          - target: linux-x64
            os: ubuntu-latest
            archFlag: ''
          - target: linux-arm64
            os: ubuntu-24.04-arm
            archFlag: ''
          - target: darwin-x64
            os: macos-latest
            archFlag: '--arch=x64'
          - target: darwin-arm64
            os: macos-latest
            archFlag: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # parser.c 是生成物（.gitignore 忽略），每台 runner 自己生成（ADR 0007 的更正段）
      - run: npm run grammar:generate
      - run: npm run hlsl:generate
      - name: prebuild grammar
        working-directory: grammar
        run: npx prebuildify --napi --strip ${{ matrix.archFlag }}
      - name: prebuild hlsl (fork)
        working-directory: hlsl
        run: npx prebuildify --napi --strip ${{ matrix.archFlag }}
      # 产物必须按目标平台命名，否则合并时会互相覆盖
      - run: mv grammar/prebuilds grammar/prebuilds-out && mv hlsl/prebuilds hlsl/prebuilds-out
        shell: bash
      # prebuildify 会按 --arch 命名产物目录（实测 darwin-x64 直接生成 darwin-x64/），无需改名；
      # 但必须校验交叉产物真是 x86_64——「假 x64」（宿主 arm64 混进档位目录）比缺档更阴险
      - name: 校验交叉产物架构（darwin-x64）
        if: matrix.target == 'darwin-x64'
        run: |
          file grammar/prebuilds-out/darwin-x64/*.node hlsl/prebuilds-out/darwin-x64/*.node | tee arch-check.txt
          if grep -q 'arm64' arch-check.txt; then echo '::error::交叉产物仍是 arm64'; exit 1; fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: |
            grammar/prebuilds-out/**
            hlsl/prebuilds-out/**

  package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: 'prebuilds-*'
          path: .ci-prebuilds
      - name: 合并 6 平台 prebuilds
        run: node scripts/merge-prebuilds.mjs .ci-prebuilds
      # dxc：ADR 0010 定「随扩展附带官方预编译」，win/linux 两档由脚本拉取并校验版本
      - run: npm run dxc:fetch
      # 冒烟：附带产物必须真能跑（lspServer 单测里「类型诊断不可用」弹窗的取证点）
      - name: dxc 冒烟（linux-x64 附带产物可执行）
        run: |
          ./third_party/dxc/linux-x64/dxc --version || { echo '--- ldd ---'; ldd ./third_party/dxc/linux-x64/dxc; exit 1; }
        shell: bash
      - run: npm run build
      - run: npm test
      - name: 打包 vsix 并打印体积口径
        run: node scripts/package.mjs | tee package-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: |
            dist-vsix/*.vsix
            package-report.json
